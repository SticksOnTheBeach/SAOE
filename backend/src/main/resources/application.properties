# --- Erreurs envoyées au site ---
server.error.include-message=always

# --- Base de données H2 (en mémoire : vidée à chaque redémarrage) ---
#spring.datasource.url=jdbc:h2:mem:saoe
#spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=

# Hibernate crée les tables à partir des entités (Room, Seat, Student...)
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console web pour voir le contenu de la base : http://localhost:8080/h2-console
#spring.h2.console.enabled=true


# Configurations de timefold

timefold.solver.termination.spent-limit=10s
timefold.solver.termination.best-score-limit=0hard/0soft



# config de databse

spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

